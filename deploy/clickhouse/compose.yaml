services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.52.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CH_ADMIN_PASSWORD: "${CH_ADMIN_PASSWORD:?inject CH_ADMIN_PASSWORD}"
      CH_WRITER_PASSWORD: "${CH_WRITER_PASSWORD:?inject CH_WRITER_PASSWORD}"
      CH_READER_PASSWORD: "${CH_READER_PASSWORD:?inject CH_READER_PASSWORD}"
    volumes:
      - /data/clickhouse/data:/var/lib/clickhouse
      - ./users.xml:/etc/clickhouse-server/users.d/analytics.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
